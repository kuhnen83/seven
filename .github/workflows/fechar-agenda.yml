name: Atualizar informação do carpete Seven
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Adicionar aviso no card Carpete
        shell: python
        run: |
          from pathlib import Path
          p=Path('agendar4.html')
          s=p.read_text(encoding='utf-8')

          old='<div id="carpeteq" class="qty"><label for="qcarpete">Quantidade em m² (R$ 49,00/m²)</label><input id="qcarpete" type="number" min="1" max="100" step="0.5" value="1" inputmode="decimal"></div>'
          new='<div id="carpeteq" class="qty carpete-box"><div class="carpete-fields"><label for="qcarpete">Quantidade em m² (R$ 49,00/m²)</label><input id="qcarpete" type="number" min="1" max="100" step="0.5" value="1" inputmode="decimal"></div><div class="carpete-info"><strong>⚠️ Informação importante</strong><span>O carpete será higienizado no local, com processo de higienização a seco. O tempo de secagem pode ser de até 8 horas.</span></div></div>'
          if old not in s:
              raise SystemExit('Bloco atual do Carpete não encontrado.')
          s=s.replace(old,new,1)

          css='''.carpete-box{display:flex!important;flex-direction:column!important;align-items:stretch!important;gap:12px!important}.carpete-fields{display:flex;align-items:center;justify-content:space-between;gap:12px}.carpete-fields label{margin:0;font-size:13px}.carpete-fields input{width:90px;text-align:center}.carpete-info{display:flex;flex-direction:column;gap:5px;background:#fff7e6;border:1px solid #f2c76d;border-radius:10px;padding:11px 12px;color:#5f4a17;font-size:12px;line-height:1.45}.carpete-info strong{color:#8a5a00;font-size:12px}@media(max-width:420px){.carpete-fields{align-items:flex-start;flex-direction:column}.carpete-fields input{width:100%}}'''
          if '.carpete-info{' not in s:
              s=s.replace('</style>',css+'</style>',1)

          p.write_text(s,encoding='utf-8')

      - name: Validar página
        shell: python
        run: |
          from pathlib import Path
          import re,subprocess,sys
          s=Path('agendar4.html').read_text(encoding='utf-8')
          for x in ['⚠️ Informação importante','higienizado no local','higienização a seco','até 8 horas','id="qcarpete"',"$('carpete').onchange=",'service-mobile-grid','seven-fixed-menu']:
              if x not in s: raise SystemExit('Faltando: '+x)
          m=re.search(r'<script type="module">(.*?)</script>',s,flags=re.S)
          if not m: raise SystemExit('Script principal não encontrado')
          Path('/tmp/check.mjs').write_text(m.group(1),encoding='utf-8')
          r=subprocess.run(['node','--check','/tmp/check.mjs'],capture_output=True,text=True)
          print(r.stderr)
          if r.returncode: sys.exit(r.returncode)

      - name: Publicar
        run: |
          git config user.name "Seven Agenda Bot"
          git config user.email "actions@users.noreply.github.com"
          git add agendar4.html
          if git diff --cached --quiet; then
            echo "Nada para publicar."
          else
            git commit -m "Adiciona aviso de higienização e secagem do carpete"
            git push
          fi
