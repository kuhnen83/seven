name: Atualizar paginas Seven

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Atualizar pagina publica
        run: python .github/scripts/update_agendar4.py
      - name: Proteger painel administrativo
        run: python .github/scripts/update_agendamento2_auth.py
      - name: Proteger dados e preparar migracao
        run: python .github/scripts/update_firestore_privacy.py
      - name: Criar menu administrativo
        run: python .github/scripts/update_admin_menu.py
      - name: Ajustar leads e carteira para celular
        run: python .github/scripts/update_admin_mobile_ui.py
      - name: Compactar leads e corrigir carteira
        run: python .github/scripts/update_admin_compact.py
      - name: Posicionar leads e carteira no topo
        run: python .github/scripts/update_admin_top.py
      - name: Centralizar leads e trazer clientes ao topo
        run: python .github/scripts/update_leads_top_center.py
      - name: Corrigir layout final de leads
        run: python .github/scripts/update_leads_layout_final.py
      - name: Fixar tela de leads no topo
        run: python .github/scripts/update_leads_fixed_screen.py
      - name: Leads em coluna unica
        run: python .github/scripts/update_leads_single_column.py
      - name: Reduzir tamanho dos leads
        run: python .github/scripts/update_leads_half_size.py
      - name: Corrigir rolagem e ficha dos leads
        run: python .github/scripts/update_leads_scroll_detail.py
      - name: Aplicar layout dos leads na carteira
        run: python .github/scripts/update_wallet_like_leads.py
      - name: Corrigir definitivamente o botao Sair
        run: python .github/scripts/update_logout_final.py
      - name: Corrigir exclusao e controles da agenda
        run: python .github/scripts/update_agenda_actions_fix.py
      - name: Corrigir salvamento de alteracoes
        run: python .github/scripts/update_save_edit_fix.py
      - name: Controlador final de Salvar Alteracoes
        run: python .github/scripts/update_save_edit_final.py
      - name: Corrigir salvamento de novo cliente
        run: python .github/scripts/update_save_new_client_fix.py
      - name: Controlador final de novo cliente
        run: python .github/scripts/update_save_new_client_final.py

      - name: Validar seguranca e painel
        run: |
          python - <<'PY'
          from pathlib import Path
          painel=Path('agendamento2.html').read_text(encoding='utf-8')
          publico=Path('agendar4.html').read_text(encoding='utf-8')
          rules=Path('firestore.rules').read_text(encoding='utf-8')
          for x in ['browserSessionPersistence','sevenLoginGate','sevenProtectedPanel','window.sevenDirectLogin','window.sevenDirectLogout=logout','sevenLogoutFinalFix','window.sevenLogoutFinal','IDLE=30*60*1000','window.sevenSignOut=signOut','window.sincronizarAgendaPublica=','btnMigrarAgendaPublica','sevenAdminSidebar','sevenLeadsScreen','sevenWalletScreen','sevenLeadsHalfSize','sevenLeadsScrollDetailFix','sevenWalletLikeLeads','sevenAgendaActionsFix','btnExcluirDetalhe','sevenExcluirAgendamentoFinal','sevenAlternarAgendaFinal','sevenFecharDiaFinal','window.sevenLastUpdateError=e','sevenSaveEditFinalFix','window.sevenSalvarAlteracoesFinal=salvar','window.sevenLastCreateError=e','sevenSaveNewClientFinalFix','window.sevenSalvarNovoClienteFinal=salvarNovo']:
              if x not in painel: raise SystemExit('Painel sem: '+x)
          if painel.count('id="sevenSaveEditFinalFix"') != 1: raise SystemExit('Controlador final de edição duplicado')
          if painel.count('id="sevenSaveNewClientFinalFix"') != 1: raise SystemExit('Controlador final de novo cliente duplicado')
          for x in ["collection(db,'agenda_publica')","agenda_publica',novoAgendamento.id",'className=\'slots\'','className=\'slot\'']:
              if x not in publico: raise SystemExit('Página pública sem escolha de horários: '+x)
          if 'sevenPeriodAvailabilityStyle' in publico or 'PERIODOS=[' in publico:
              raise SystemExit('Página pública ainda contém seleção por períodos')
          if "collection(db,'agendamentos'),where('service_date'" in publico: raise SystemExit('Página pública ainda tenta ler dados privados')
          for x in ['allow read, update, delete: if isAdmin();','match /agenda_publica/{id}','allow read: if true;']:
              if x not in rules: raise SystemExit('Rules sem: '+x)
          print('Segurança, novo cliente, edição e escolha de dia/horário validadas')
          PY

      - name: Publicar
        run: |
          git config user.name "Seven Agenda Bot"
          git config user.email "actions@users.noreply.github.com"
          git add agendar4.html agendamento2.html firestore.rules
          if git diff --cached --quiet; then
            echo "Sem alteracoes."
          else
            git commit -m "Corrige definitivamente novo cliente"
            git push
          fi
