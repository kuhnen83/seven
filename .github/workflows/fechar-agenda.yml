name: Atualizar pagina de agendamento Seven

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Atualizar agendar4
        run: python .github/scripts/update_agendar4.py

      - name: Adicionar card Impermeabilizacao
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('agendar4.html')
          s=p.read_text(encoding='utf-8')

          if 'id="imp"' not in s:
              carpet='<div class="service service-card"><label><input type="checkbox" id="carpete">'
              if carpet not in s:
                  raise SystemExit('Card Carpete nao encontrado')
              card='''<div class="service service-card"><label><input type="checkbox" id="imp"><span class="service-icon">🛡️</span><span class="service-name">Impermeabilização</span><span class="service-count">4 opções</span></label><div id="impv" class="variants">
<label class="variant"><span><input type="radio" name="impv" value="298" data-name="Impermeabilização sofá até 1,80 m" data-dur="120"> Sofá até 1,80 m</span><b>R$ 298,00</b></label>
<label class="variant"><span><input type="radio" name="impv" value="338" data-name="Impermeabilização sofá até 2,30 m" data-dur="120"> Sofá até 2,30 m</span><b>R$ 338,00</b></label>
<label class="variant"><span><input type="radio" name="impv" value="378" data-name="Impermeabilização sofá até 2,65 m" data-dur="120"> Sofá até 2,65 m</span><b>R$ 378,00</b></label>
<label class="variant"><span><input type="radio" name="impv" value="418" data-name="Impermeabilização sofá até 3,00 m" data-dur="120"> Sofá até 3,00 m</span><b>R$ 418,00</b></label>
</div></div>
'''
              s=s.replace(carpet,card+carpet,1)

          # Inclui impermeabilizacao no cálculo.
          if "$('imp').checked" not in s:
              pattern=r"(function items\(\)\{.*?)(return a\})"
              m=re.search(pattern,s,re.S)
              if not m:
                  raise SystemExit('Funcao items() nao encontrada')
              add="if($('imp').checked){const x=document.querySelector('input[name=impv]:checked');if(!x)return null;a.push({name:x.dataset.name,price:+x.value,dur:+x.dataset.dur,quantity:1,unit_price:+x.value})}"
              s=s[:m.start(2)]+add+s[m.start(2):]

          # Inicializa o bloco fechado.
          if "$('impv').style.display='none'" not in s:
              marker="$('cabv').style.display='none';"
              if marker not in s:
                  raise SystemExit('Inicializacao dos servicos nao encontrada')
              s=s.replace(marker,marker+"$('impv').style.display='none';",1)

          # Abre e fecha o card e recalcula o total.
          if "$('imp').onchange=" not in s:
              marker="$('sofa').onchange=()=>{"
              if marker not in s:
                  raise SystemExit('Eventos dos servicos nao encontrados')
              event="$('imp').onchange=()=>{$('impv').style.display=$('imp').checked?'block':'none';if(!$('imp').checked)document.querySelectorAll('input[name=impv]').forEach(x=>x.checked=false);calc()};"
              s=s.replace(marker,event+marker,1)

          # Valida escolha do tamanho antes de avancar.
          if "$('imp').checked&&!document.querySelector('input[name=impv]:checked')" not in s:
              old="($('cab').checked&&!document.querySelector('input[name=cabv]:checked'))"
              new=old+"||($('imp').checked&&!document.querySelector('input[name=impv]:checked'))"
              if old in s:
                  s=s.replace(old,new,1)

          p.write_text(s,encoding='utf-8')
          PY

      - name: Deixar card Carpete horizontal
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('agendar4.html')
          s=p.read_text(encoding='utf-8')
          css='''
/* ===== Carpete horizontal largura dupla ===== */
.service-mobile-grid .service-card:has(#carpete){grid-column:span 2!important}
.service-mobile-grid .service-card:has(#carpete)>label{min-height:78px!important;display:grid!important;grid-template-columns:42px 1fr!important;grid-template-rows:auto auto!important;column-gap:10px!important;align-items:center!important;padding:10px 12px!important}
.service-mobile-grid .service-card:has(#carpete) .service-icon{grid-row:1/3!important;margin:0!important;width:36px!important;height:36px!important;font-size:20px!important}
.service-mobile-grid .service-card:has(#carpete) .service-name{font-size:15px!important;align-self:end!important}
.service-mobile-grid .service-card:has(#carpete) .service-count{font-size:11px!important;padding:2px 0 0!important;margin:0!important;align-self:start!important}
@media(max-width:700px){.service-mobile-grid .service-card:has(#carpete){grid-column:1/-1!important}.service-mobile-grid .service-card:has(#carpete)>label{min-height:72px!important;grid-template-columns:38px 1fr!important;padding:9px 10px!important}.service-mobile-grid .service-card:has(#carpete) .service-icon{width:32px!important;height:32px!important;font-size:18px!important}.service-mobile-grid .service-card:has(#carpete) .service-name{font-size:14px!important}.service-mobile-grid .service-card:has(#carpete) .service-count{font-size:10px!important}}
'''
          marker='/* ===== Carpete horizontal largura dupla ===== */'
          if marker not in s:
              s=s.replace('</style>',css+'</style>',1)
          else:
              s=re.sub(r'/\* ===== Carpete horizontal largura dupla ===== \*/.*?(?=</style>)',css.strip()+'\n',s,flags=re.S)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Validar JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, sys
          s = Path('agendar4.html').read_text(encoding='utf-8')
          required = [
              'id="sofa"','id="col"','id="pol"','id="cad"','id="carro"','id="carpete"','id="cab"','id="imp"',
              'R$ 298,00','R$ 338,00','R$ 378,00','R$ 418,00',
              "$('imp').onchange=", "$('imp').checked",
              'Escolha o item abaixo, veja o preço e agende em 2 minutos.',
              'Pague só no dia','Seguro para pets e crianças','Cards compactos Seven',
              'Carpete horizontal largura dupla'
          ]
          for item in required:
              if item not in s:
                  raise SystemExit('Faltando: ' + item)
          m = re.search(r'<script type="module">(.*?)</script>', s, re.S)
          if not m:
              raise SystemExit('Script principal nao encontrado')
          Path('/tmp/check.mjs').write_text(m.group(1), encoding='utf-8')
          r = subprocess.run(['node','--check','/tmp/check.mjs'], capture_output=True, text=True)
          print(r.stderr)
          sys.exit(r.returncode)
          PY

      - name: Publicar alteracao
        run: |
          git config user.name "Seven Agenda Bot"
          git config user.email "actions@users.noreply.github.com"
          git add agendar4.html
          if git diff --cached --quiet; then
            echo "Pagina ja esta atualizada."
          else
            git commit -m "Adiciona card de impermeabilizacao"
            git push
          fi
