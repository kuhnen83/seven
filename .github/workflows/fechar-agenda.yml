name: Corrigir novos cards Seven
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Aplicar carro, carpete e cabeceira no agendar4
        shell: python
        run: |
          from pathlib import Path
          p=Path('agendar4.html')
          s=p.read_text(encoding='utf-8')

          # 1) Insere os novos cards dentro da grade existente.
          if 'id="carro"' not in s:
              old='''<div class="service service-card"><label><input type="checkbox" id="cad"><span class="service-icon">🪑</span><span class="service-name">Cadeiras</span><span class="service-count">Por quantidade</span></label><div id="cadq" class="qty"><label for="qcad">Quantidade (R$ 24,00 cada)</label><input id="qcad" type="number" min="1" max="50" value="1" inputmode="numeric"></div></div></div>
<div class="total"><strong>Total</strong><strong id="total">R$ 0,00</strong></div>'''
              new='''<div class="service service-card"><label><input type="checkbox" id="cad"><span class="service-icon">🪑</span><span class="service-name">Cadeiras</span><span class="service-count">Por quantidade</span></label><div id="cadq" class="qty"><label for="qcad">Quantidade (R$ 24,00 cada)</label><input id="qcad" type="number" min="1" max="50" value="1" inputmode="numeric"></div></div>

<div class="service service-card"><label><input type="checkbox" id="carro"><span class="service-icon">🚗</span><span class="service-name">Carro</span><span class="service-count">4 opções</span></label><div id="carrov" class="variants">
<label class="variant"><span><input type="radio" name="carv" value="209" data-name="Hatch - bancos e carpete" data-dur="120"> Hatch - bancos e carpete</span><b>R$ 209,00</b></label>
<label class="variant"><span><input type="radio" name="carv" value="249" data-name="Sedan - bancos e carpete" data-dur="120"> Sedan - bancos e carpete</span><b>R$ 249,00</b></label>
<label class="variant"><span><input type="radio" name="carv" value="289" data-name="SUV - bancos e carpete" data-dur="120"> SUV - bancos e carpete</span><b>R$ 289,00</b></label>
<label class="variant"><span><input type="radio" name="carv" value="289" data-name="Caminhonete - bancos e carpete" data-dur="120"> Caminhonete - bancos e carpete</span><b>R$ 289,00</b></label>
</div></div>

<div class="service service-card"><label><input type="checkbox" id="carpete"><span class="service-icon">🧹</span><span class="service-name">Carpete</span><span class="service-count">R$ 49/m²</span></label><div id="carpeteq" class="qty"><label for="qcarpete">Quantidade em m² (R$ 49,00/m²)</label><input id="qcarpete" type="number" min="1" max="100" step="0.5" value="1" inputmode="decimal"></div></div>

<div class="service service-card"><label><input type="checkbox" id="cab"><span class="service-icon">🛏️</span><span class="service-name">Cabeceira</span><span class="service-count">4 opções</span></label><div id="cabv" class="variants">
<label class="variant"><span><input type="radio" name="cabv" value="109" data-name="Cabeceira solteiro" data-dur="60"> Cabeceira solteiro</span><b>R$ 109,00</b></label>
<label class="variant"><span><input type="radio" name="cabv" value="139" data-name="Cabeceira casal" data-dur="60"> Cabeceira casal</span><b>R$ 139,00</b></label>
<label class="variant"><span><input type="radio" name="cabv" value="149" data-name="Cabeceira Queen" data-dur="60"> Cabeceira Queen</span><b>R$ 149,00</b></label>
<label class="variant"><span><input type="radio" name="cabv" value="169" data-name="Cabeceira King" data-dur="60"> Cabeceira King</span><b>R$ 169,00</b></label>
</div></div>
</div>
<div class="total"><strong>Total</strong><strong id="total">R$ 0,00</strong></div>'''
              if old not in s:
                  raise SystemExit('Não encontrei o fim atual da grade de serviços.')
              s=s.replace(old,new,1)

          # 2) Inclui os novos serviços no cálculo.
          old_items="if($('cad').checked){const q=qty('qcad',1,50);a.push({name:'Cadeira',price:24*q,dur:60*q,quantity:q,unit_price:24})}return a}"
          new_items="if($('cad').checked){const q=qty('qcad',1,50);a.push({name:'Cadeira',price:24*q,dur:60*q,quantity:q,unit_price:24})}if($('carro').checked){const x=document.querySelector('input[name=carv]:checked');if(!x)return null;a.push({name:x.dataset.name,price:+x.value,dur:+x.dataset.dur,quantity:1,unit_price:+x.value})}if($('carpete').checked){const q=Math.max(1,Math.min(100,parseFloat($('qcarpete').value)||1));$('qcarpete').value=q;a.push({name:'Carpete '+q.toLocaleString('pt-BR')+' m²',price:49*q,dur:Math.max(30,Math.ceil(q*30)),quantity:q,unit_price:49})}if($('cab').checked){const x=document.querySelector('input[name=cabv]:checked');if(!x)return null;a.push({name:x.dataset.name,price:+x.value,dur:+x.dataset.dur,quantity:1,unit_price:+x.value})}return a}"
          if "$('carro').checked" not in s:
              if old_items not in s: raise SystemExit('Função items atual não encontrada.')
              s=s.replace(old_items,new_items,1)

          # 3) Inicialização e eventos dos cards novos.
          old_init="$('polq').style.display='none';$('cadq').style.display='none';"
          new_init="$('polq').style.display='none';$('cadq').style.display='none';$('carrov').style.display='none';$('carpeteq').style.display='none';$('cabv').style.display='none';"
          if "$('carrov').style.display='none'" not in s:
              if old_init not in s: raise SystemExit('Inicialização dos serviços não encontrada.')
              s=s.replace(old_init,new_init,1)

          old_events="$('sofa').onchange=()=>{"
          add_events="""$('carro').onchange=()=>{$('carrov').style.display=$('carro').checked?'block':'none';if(!$('carro').checked)document.querySelectorAll('input[name=carv]').forEach(x=>x.checked=false);calc()};$('carpete').onchange=()=>{$('carpeteq').style.display=$('carpete').checked?'flex':'none';calc()};$('cab').onchange=()=>{$('cabv').style.display=$('cab').checked?'block':'none';if(!$('cab').checked)document.querySelectorAll('input[name=cabv]').forEach(x=>x.checked=false);calc()};$('qcarpete').oninput=calc;"""
          if "$('carro').onchange=" not in s:
              if old_events not in s: raise SystemExit('Eventos dos serviços não encontrados.')
              s=s.replace(old_events,add_events+old_events,1)

          # 4) Validação para opções obrigatórias.
          old_val="if(($('sofa').checked&&!document.querySelector('input[name=sv]:checked'))||($('col').checked&&!document.querySelector('input[name=cv]:checked'))){error('Selecione o tamanho do sofá ou colchão.');return}"
          new_val="if(($('sofa').checked&&!document.querySelector('input[name=sv]:checked'))||($('col').checked&&!document.querySelector('input[name=cv]:checked'))||($('carro').checked&&!document.querySelector('input[name=carv]:checked'))||($('cab').checked&&!document.querySelector('input[name=cabv]:checked'))){error('Selecione a opção do serviço escolhido.');return}"
          if old_val in s:
              s=s.replace(old_val,new_val,1)

          p.write_text(s,encoding='utf-8')

      - name: Validar antes de publicar
        shell: python
        run: |
          from pathlib import Path
          import re,subprocess,sys
          s=Path('agendar4.html').read_text(encoding='utf-8')
          obrigatorios=[
            'id="carro"','id="carpete"','id="cab"',
            'Hatch - bancos e carpete','Sedan - bancos e carpete','SUV - bancos e carpete','Caminhonete - bancos e carpete',
            'R$ 209,00','R$ 249,00','R$ 289,00','R$ 49,00/m²',
            'Cabeceira solteiro','Cabeceira casal','Cabeceira Queen','Cabeceira King',
            'R$ 109,00','R$ 139,00','R$ 149,00','R$ 169,00',
            "$('carro').onchange=","$('carpete').onchange=","$('cab').onchange=",
            'service-mobile-grid','seven-fixed-menu'
          ]
          for x in obrigatorios:
              if x not in s: raise SystemExit('Faltando: '+x)
          m=re.search(r'<script type="module">(.*?)</script>',s,flags=re.S)
          if not m: raise SystemExit('Script principal não encontrado')
          Path('/tmp/check.mjs').write_text(m.group(1),encoding='utf-8')
          r=subprocess.run(['node','--check','/tmp/check.mjs'],capture_output=True,text=True)
          print(r.stderr)
          if r.returncode: sys.exit(r.returncode)
          print('VALIDAÇÃO OK')

      - name: Publicar
        run: |
          git config user.name "Seven Agenda Bot"
          git config user.email "actions@users.noreply.github.com"
          git add agendar4.html
          if git diff --cached --quiet; then
            echo "Nada para publicar."
          else
            git commit -m "Publica cards de carro, carpete e cabeceira"
            git push
          fi
