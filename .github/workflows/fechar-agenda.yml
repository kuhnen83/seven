name: Atualizar serviços mobile Seven
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Transformar serviços em cards mobile
        shell: python
        run: |
          from pathlib import Path
          p=Path('agendar4.html')
          s=p.read_text(encoding='utf-8')

          # Mantém os mesmos inputs/IDs para preservar toda a lógica existente.
          old_sofa='<div class="service"><label><input type="checkbox" id="sofa"> 🛋️ Higienização de sofá</label><div id="svs" class="variants">'
          new_sofa='<div class="service service-card"><label><input type="checkbox" id="sofa"><span class="service-icon">🛋️</span><span class="service-name">Sofás</span><span class="service-count">4 opções</span></label><div id="svs" class="variants">'
          old_col='<div class="service"><label><input type="checkbox" id="col"> 🛏️ Higienização de colchão</label><div id="cvs" class="variants">'
          new_col='<div class="service service-card"><label><input type="checkbox" id="col"><span class="service-icon">🛏️</span><span class="service-name">Colchões</span><span class="service-count">4 opções</span></label><div id="cvs" class="variants">'
          old_pol='<div class="service"><label><input type="checkbox" id="pol"> 🪑 Higienização de poltrona</label><div id="polq" class="qty">'
          new_pol='<div class="service service-card"><label><input type="checkbox" id="pol"><span class="service-icon">🪑</span><span class="service-name">Poltronas</span><span class="service-count">Por quantidade</span></label><div id="polq" class="qty">'
          old_cad='<div class="service"><label><input type="checkbox" id="cad"> 🪑 Higienização de cadeiras</label><div id="cadq" class="qty">'
          new_cad='<div class="service service-card"><label><input type="checkbox" id="cad"><span class="service-icon">🪑</span><span class="service-name">Cadeiras</span><span class="service-count">Por quantidade</span></label><div id="cadq" class="qty">'

          for old,new in [(old_sofa,new_sofa),(old_col,new_col),(old_pol,new_pol),(old_cad,new_cad)]:
              if old in s:
                  s=s.replace(old,new,1)

          # Agrupa somente os serviços, sem tocar nos campos, total ou botões.
          if 'class="service-mobile-grid"' not in s:
              first='<div class="service service-card"><label><input type="checkbox" id="sofa">'
              if first not in s: raise SystemExit('Card de sofá não encontrado')
              s=s.replace(first,'<div class="service-mobile-grid">'+first,1)
              end='<div id="cadq" class="qty"><label for="qcad">Quantidade (R$ 24,00 cada)</label><input id="qcad" type="number" min="1" max="50" value="1" inputmode="numeric"></div></div>\n<div class="total">'
              if end not in s: raise SystemExit('Fim do bloco de cadeiras não encontrado')
              s=s.replace(end,'<div id="cadq" class="qty"><label for="qcad">Quantidade (R$ 24,00 cada)</label><input id="qcad" type="number" min="1" max="50" value="1" inputmode="numeric"></div></div></div>\n<div class="total">',1)

          css='''.service-mobile-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:18px 0}.service-mobile-grid .service-card{margin:0;padding:0;border:1px solid #dce6f1;border-radius:18px;background:#fff;overflow:hidden;box-shadow:0 8px 18px #0b17300d;transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}.service-mobile-grid .service-card:hover{transform:translateY(-1px);border-color:#9bbff0;box-shadow:0 10px 22px #0b173016}.service-mobile-grid .service-card>label{display:flex!important;flex-direction:column!important;align-items:flex-start!important;justify-content:flex-start!important;min-height:150px!important;padding:16px!important;gap:0!important;cursor:pointer!important;color:#071b3a!important;position:relative!important;box-sizing:border-box!important}.service-mobile-grid .service-card>label input[type=checkbox]{position:absolute!important;opacity:0!important;pointer-events:none!important;width:1px!important;height:1px!important}.service-icon{width:50px;height:50px;border-radius:14px;background:#eef4ff;display:flex;align-items:center;justify-content:center;font-size:27px;margin-bottom:13px;box-shadow:inset 0 0 0 1px #e1eaff}.service-name{font-size:20px;font-weight:900;color:#071b3a;line-height:1.1}.service-count{font-size:14px;color:#70809a;margin-top:auto;padding-top:12px}.service-card:has(input:checked){grid-column:1/-1;border-color:#2d7eea;box-shadow:0 0 0 2px #2d7eea20,0 10px 24px #0b173016}.service-card:has(input:checked)>label{min-height:auto!important;display:grid!important;grid-template-columns:58px 1fr!important;grid-template-rows:auto auto!important;align-items:center!important;padding:14px 16px!important}.service-card:has(input:checked) .service-icon{grid-row:1/3;margin:0;width:48px;height:48px}.service-card:has(input:checked) .service-name{font-size:18px}.service-card:has(input:checked) .service-count{margin:2px 0 0;padding:0;font-size:13px}.service-mobile-grid .variants,.service-mobile-grid .qty{margin:0 14px 14px}.service-mobile-grid .variant{background:#f8fbff}.service-mobile-grid .qty{background:#f7fafc}@media(min-width:701px){.service-mobile-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.service-mobile-grid .service-card>label{min-height:145px}.service-card:has(input:checked){grid-column:span 2}}@media(max-width:420px){.service-mobile-grid{gap:10px}.service-mobile-grid .service-card>label{min-height:138px!important;padding:13px!important}.service-icon{width:46px;height:46px;font-size:24px;margin-bottom:11px}.service-name{font-size:17px}.service-count{font-size:12px}.service-card:has(input:checked)>label{min-height:auto!important}}'''
          if '.service-mobile-grid{' not in s:
              s=s.replace('</style>',css+'</style>',1)

          p.write_text(s,encoding='utf-8')

      - name: Validar página e JavaScript
        shell: python
        run: |
          from pathlib import Path
          import re,subprocess,sys
          s=Path('agendar4.html').read_text(encoding='utf-8')
          for x in ['service-mobile-grid','service-card','service-icon','service-count','id="sofa"','id="col"','id="pol"','id="cad"',"$('sofa').onchange=","$('col').onchange=",'R$ 149,00','R$ 209,00','seven-fixed-menu']:
              if x not in s: raise SystemExit('Elemento ausente: '+x)
          m=re.search(r'<script type="module">(.*?)</script>',s,flags=re.S)
          if not m: raise SystemExit('Script principal não encontrado')
          Path('/tmp/check.mjs').write_text(m.group(1),encoding='utf-8')
          r=subprocess.run(['node','--check','/tmp/check.mjs'],capture_output=True,text=True)
          print(r.stderr)
          if r.returncode: sys.exit(r.returncode)
          print('OK: cards mobile adicionados sem alterar a lógica do agendamento.')

      - name: Publicar
        run: |
          git config user.name "Seven Agenda Bot"
          git config user.email "actions@users.noreply.github.com"
          git add agendar4.html
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária."
          else
            git commit -m "Transforma serviços em cards otimizados para celular"
            git push
          fi
