name: Corrigir controles da agenda Seven
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir JavaScript da agenda
        shell: python
        run: |
          from pathlib import Path

          p=Path('agendamento2.html')
          s=p.read_text(encoding='utf-8')

          # O código antigo chamava window.sevenAuthState antes do módulo
          # Firebase terminar de inicializar. Isso interrompia todo o script
          # clássico da agenda e fazia os botões parecerem sem ação.
          s=s.replace("window.sevenAuthState(window.sevenAuth,user=>{const b=document.getElementById('btnFecharAgenda');if(b)b.title=user?'Administrador conectado':'Login necessário para alterar a agenda'});\n", "")

          # Garante que o botão continue ligado à função administrativa mesmo
          # que algum HTML antigo tenha perdido o onclick.
          marker='<button id="btnFecharAgenda" class="btn red" onclick="alternarAgenda()">'
          if marker in s and 'id="sevenAgendaClickFix"' not in s:
              fix='''<script id="sevenAgendaClickFix">document.addEventListener('DOMContentLoaded',function(){var b=document.getElementById('btnFecharAgenda');if(b){b.addEventListener('click',function(e){if(typeof window.alternarAgenda==='function'){e.preventDefault();window.alternarAgenda();}},true);}});</script>'''
              pos=s.rfind('</body>')
              if pos<0: raise SystemExit('</body> não encontrado')
              s=s[:pos]+fix+'\n'+s[pos:]

          p.write_text(s,encoding='utf-8')

      - name: Validar
        shell: python
        run: |
          from pathlib import Path
          s=Path('agendamento2.html').read_text(encoding='utf-8')
          if 'window.sevenAuthState(window.sevenAuth' in s:
              raise SystemExit('Chamada prematura do Firebase Authentication ainda presente')
          for x in ['window.alternarAgenda=async function','window.adicionarDiaFechado=async function','id="btnFecharAgenda"','id="dataFecharAgenda"']:
              if x not in s: raise SystemExit('Função/elemento ausente: '+x)
          print('VALIDAÇÃO OK: JavaScript dos controles da agenda corrigido.')

      - name: Publicar
        run: |
          git config user.name "Seven Agenda Bot"
          git config user.email "actions@users.noreply.github.com"
          git add agendamento2.html
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária."
          else
            git commit -m "Corrige botões fechar agenda e dias específicos"
            git push
          fi
