name: Atualizar paginas Seven

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Atualizar pagina publica
        run: python .github/scripts/update_agendar4.py

      - name: Proteger sessao administrativa
        run: python .github/scripts/update_agendamento2_auth.py

      - name: Validar protecao administrativa
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('agendamento2.html').read_text(encoding='utf-8')
          required=['browserSessionPersistence','sevenAdminSessionSecurity','TEMPO_INATIVIDADE=30*60*1000','seven_admin_last_activity','window.sevenSignOut=signOut']
          for x in required:
              if x not in s: raise SystemExit('Faltando: '+x)
          print('Protecao administrativa validada')
          PY

      - name: Publicar
        run: |
          git config user.name "Seven Agenda Bot"
          git config user.email "actions@users.noreply.github.com"
          git add agendar4.html agendamento2.html
          if git diff --cached --quiet; then
            echo "Sem alteracoes."
          else
            git commit -m "Atualiza paginas Seven"
            git push
          fi
