name: Atualizar pagina de agendamento Seven
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  atualizar:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar atualizacoes
        run: python .github/scripts/update_agendar4.py
      - name: Validar JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, sys
          s=Path('agendar4.html').read_text(encoding='utf-8')
          m=re.search(r'<script type="module">(.*?)</script>',s,re.S)
          if not m: raise SystemExit('Script principal nao encontrado')
          Path('/tmp/check.mjs').write_text(m.group(1),encoding='utf-8')
          r=subprocess.run(['node','--check','/tmp/check.mjs'],capture_output=True,text=True)
          print(r.stderr)
          sys.exit(r.returncode)
          PY
      - name: Publicar
        run: |
          git config user.name "Seven Agenda Bot"
          git config user.email "actions@users.noreply.github.com"
          git add agendar4.html
          if git diff --cached --quiet; then
            echo "Pagina ja esta atualizada."
          else
            git commit -m "Atualiza cards e servicos do agendamento"
            git push
          fi
