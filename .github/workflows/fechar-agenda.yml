name: Atualizar agendar4

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar atualizacoes
        run: python .github/scripts/update_agendar4.py
      - name: Publicar
        run: |
          git config user.name "Seven Agenda Bot"
          git config user.email "actions@users.noreply.github.com"
          git add agendar4.html
          if git diff --cached --quiet; then
            echo "Sem alteracoes."
          else
            git commit -m "Atualiza pagina de agendamento"
            git push
          fi
