name: Atualizar paginas Seven

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Atualizar pagina publica
        run: python .github/scripts/update_agendar4.py

      - name: Proteger painel administrativo
        run: python .github/scripts/update_agendamento2_auth.py

      - name: Proteger dados e preparar migracao
        run: python .github/scripts/update_firestore_privacy.py

      - name: Criar menu administrativo
        run: python .github/scripts/update_admin_menu.py

      - name: Ajustar leads e carteira para celular
        run: python .github/scripts/update_admin_mobile_ui.py

      - name: Compactar leads e corrigir carteira
        run: python .github/scripts/update_admin_compact.py

      - name: Validar seguranca e painel
        run: |
          python - <<'PY'
          from pathlib import Path
          painel=Path('agendamento2.html').read_text(encoding='utf-8')
          publico=Path('agendar4.html').read_text(encoding='utf-8')
          rules=Path('firestore.rules').read_text(encoding='utf-8')
          for x in ['browserSessionPersistence','sevenLoginGate','sevenProtectedPanel','sevenStandaloneLogin','window.sevenDirectLogin','sevenLogoutBtn','IDLE=30*60*1000','window.sevenSignOut=signOut','window.sincronizarAgendaPublica=','window.migrarAgendaPublica=','btnMigrarAgendaPublica','sevenAdminSidebar','sevenLeadsScreen','sevenWalletScreen','data-seven-screen="agenda"','data-seven-screen="novo"','data-seven-screen="leads"','data-seven-screen="carteira"','sevenAdminMobileUI','sevenAdminCompactFix']:
              if x not in painel: raise SystemExit('Painel sem: '+x)
          for x in ["collection(db,'agenda_publica')","agenda_publica',novoAgendamento.id"]:
              if x not in publico: raise SystemExit('Página pública sem: '+x)
          if "collection(db,'agendamentos'),where('service_date'" in publico:
              raise SystemExit('Página pública ainda tenta ler dados privados')
          for x in ['allow read, update, delete: if isAdmin();','match /agenda_publica/{id}','allow read: if true;']:
              if x not in rules: raise SystemExit('Rules sem: '+x)
          print('Segurança e painel Seven validados')
          PY

      - name: Publicar
        run: |
          git config user.name "Seven Agenda Bot"
          git config user.email "actions@users.noreply.github.com"
          git add agendar4.html agendamento2.html firestore.rules
          if git diff --cached --quiet; then
            echo "Sem alteracoes."
          else
            git commit -m "Compacta leads e corrige carteira mobile"
            git push
          fi
