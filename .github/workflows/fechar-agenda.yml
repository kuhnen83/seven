name: Atualizar pagina de agendamento Seven
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  atualizar:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4

      - name: Aplicar atualizacoes existentes
        run: python .github/scripts/update_agendar4.py

      - name: Compactar cards de servicos
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('agendar4.html')
          s=p.read_text(encoding='utf-8')
          css='''
/* ===== Cards compactos Seven ===== */
.service-mobile-grid{gap:8px!important;margin:12px 0 14px!important}
.service-mobile-grid .service-card{border-radius:12px!important;box-shadow:0 4px 12px #0b17300b!important}
.service-mobile-grid .service-card>label{min-height:96px!important;padding:9px 10px!important}
.service-icon{width:34px!important;height:34px!important;border-radius:9px!important;font-size:19px!important;margin-bottom:6px!important}
.service-name{font-size:15px!important;line-height:1!important}
.service-count{font-size:10.5px!important;padding-top:5px!important}
.service-card:has(input:checked)>label{padding:9px 10px!important;grid-template-columns:42px 1fr!important}
.service-card:has(input:checked) .service-icon{width:34px!important;height:34px!important}
.service-card:has(input:checked) .service-name{font-size:15px!important}
.service-card:has(input:checked) .service-count{font-size:10.5px!important}
.service-mobile-grid .variants,.service-mobile-grid .qty{margin:0 8px 8px!important}
.service-mobile-grid .variant{padding:7px!important;margin:5px 0!important}
@media(min-width:701px){
  .service-mobile-grid{grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:10px!important}
  .service-mobile-grid .service-card>label{min-height:102px!important}
}
@media(max-width:700px){
  .service-mobile-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:8px!important}
  .service-mobile-grid .service-card>label{min-height:92px!important;padding:8px 9px!important}
  .service-icon{width:32px!important;height:32px!important;font-size:18px!important;margin-bottom:5px!important}
  .service-name{font-size:14px!important}
  .service-count{font-size:10px!important;padding-top:4px!important}
}
@media(max-width:380px){
  .service-mobile-grid{gap:7px!important}
  .service-mobile-grid .service-card>label{min-height:88px!important;padding:7px 8px!important}
  .service-icon{width:30px!important;height:30px!important;font-size:17px!important}
  .service-name{font-size:13.5px!important}
  .service-count{font-size:9.5px!important}
}
'''
          marker='/* ===== Cards compactos Seven ===== */'
          if marker not in s:
              s=s.replace('</style>',css+'</style>',1)
          else:
              s=re.sub(r'/\* ===== Cards compactos Seven ===== \*/.*?(?=</style>)',css.strip()+'\n',s,flags=re.S)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Validar JavaScript e cards
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, sys
          s=Path('agendar4.html').read_text(encoding='utf-8')
          for item in ['id="sofa"','id="col"','id="pol"','id="cad"','id="carro"','id="carpete"','id="cab"','Cards compactos Seven']:
              if item not in s:
                  raise SystemExit('Faltando: '+item)
          m=re.search(r'<script type="module">(.*?)</script>',s,re.S)
          if not m:
              raise SystemExit('Script principal nao encontrado')
          Path('/tmp/check.mjs').write_text(m.group(1),encoding='utf-8')
          r=subprocess.run(['node','--check','/tmp/check.mjs'],capture_output=True,text=True)
          print(r.stderr)
          sys.exit(r.returncode)
          PY

      - name: Publicar
        run: |
          git config user.name "Seven Agenda Bot"
          git config user.email "actions@users.noreply.github.com"
          git add agendar4.html
          if git diff --cached --quiet; then
            echo "Pagina ja esta atualizada."
          else
            git commit -m "Deixa cards de servicos mais compactos"
            git push
          fi
