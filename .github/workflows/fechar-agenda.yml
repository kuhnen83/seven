name: Atualizar serviços Seven
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Atualizar preços no agendar4
        shell: python
        run: |
          from pathlib import Path
          p=Path('agendar4.html')
          s=p.read_text(encoding='utf-8')

          # Caminhonete passa a ter o mesmo valor da SUV.
          old_cam='<label class="variant variant-disabled"><span>🛻 Caminhonete - bancos e carpete</span><b>Valor a confirmar</b></label>'
          new_cam='<label class="variant"><span><input type="radio" name="carv" value="289" data-name="Caminhonete - bancos e carpete" data-dur="120"> Caminhonete - bancos e carpete</span><b>R$ 289,00</b></label>'
          if old_cam in s:
              s=s.replace(old_cam,new_cam,1)

          # Cabeceiras: completa as quatro opções e atualiza a contagem visual.
          s=s.replace('<span class="service-name">Cabeceira</span><span class="service-count">1 opção</span>', '<span class="service-name">Cabeceira</span><span class="service-count">4 opções</span>',1)
          old_cab='<label class="variant"><span><input type="radio" name="cabv" value="109" data-name="Cabeceira solteiro" data-dur="60"> Cabeceira solteiro</span><b>R$ 109,00</b></label>'
          new_cab='''<label class="variant"><span><input type="radio" name="cabv" value="109" data-name="Cabeceira solteiro" data-dur="60"> Cabeceira solteiro</span><b>R$ 109,00</b></label>
<label class="variant"><span><input type="radio" name="cabv" value="139" data-name="Cabeceira casal" data-dur="60"> Cabeceira casal</span><b>R$ 139,00</b></label>
<label class="variant"><span><input type="radio" name="cabv" value="149" data-name="Cabeceira Queen" data-dur="60"> Cabeceira Queen</span><b>R$ 149,00</b></label>
<label class="variant"><span><input type="radio" name="cabv" value="169" data-name="Cabeceira King" data-dur="60"> Cabeceira King</span><b>R$ 169,00</b></label>'''
          if old_cab in s and 'Cabeceira casal' not in s:
              s=s.replace(old_cab,new_cab,1)

          p.write_text(s,encoding='utf-8')

      - name: Validar página e JavaScript
        shell: python
        run: |
          from pathlib import Path
          import re,subprocess,sys
          s=Path('agendar4.html').read_text(encoding='utf-8')
          for x in [
            'Caminhonete - bancos e carpete','value="289" data-name="Caminhonete - bancos e carpete"',
            'Cabeceira solteiro','R$ 109,00','Cabeceira casal','R$ 139,00',
            'Cabeceira Queen','R$ 149,00','Cabeceira King','R$ 169,00','4 opções',
            "$('carro').onchange=","$('cab').onchange=",'service-mobile-grid','seven-fixed-menu'
          ]:
              if x not in s: raise SystemExit('Elemento ausente: '+x)
          m=re.search(r'<script type="module">(.*?)</script>',s,flags=re.S)
          if not m: raise SystemExit('Script principal não encontrado')
          Path('/tmp/check.mjs').write_text(m.group(1),encoding='utf-8')
          r=subprocess.run(['node','--check','/tmp/check.mjs'],capture_output=True,text=True)
          print(r.stderr)
          if r.returncode: sys.exit(r.returncode)
          print('OK: preços de caminhonete e cabeceiras atualizados.')

      - name: Publicar
        run: |
          git config user.name "Seven Agenda Bot"
          git config user.email "actions@users.noreply.github.com"
          git add agendar4.html
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária."
          else
            git commit -m "Atualiza preços de caminhonete e cabeceiras"
            git push
          fi
