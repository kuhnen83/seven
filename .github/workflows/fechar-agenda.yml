name: Atualizar logo Seven
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar logo PNG oficial
        shell: python
        run: |
          from pathlib import Path
          p=Path('agendar4.html')
          s=p.read_text(encoding='utf-8')
          # Troca qualquer referência antiga pela nova logo PNG enviada ao repositório.
          s=s.replace('src="seven-logo.svg"','src="./seven-logo.png?v=3"')
          s=s.replace('src="./seven-logo.svg?v=2"','src="./seven-logo.png?v=3"')
          s=s.replace('<div class="brand-copy"><strong>Seven Limpeza</strong><p>Higienização profissional de estofados</p></div>','<div class="brand-copy"><p>Higienização profissional de estofados</p></div>')
          # Ajuste de tamanho para preservar a proporção da logo horizontal.
          extra='''.brand-logo{width:220px!important;height:auto!important;max-height:125px!important;object-fit:contain!important;background:transparent!important}.brand-copy p{margin:0;color:#fff}@media(max-width:600px){.brand-logo{width:155px!important;max-height:90px!important}}'''
          if 'width:220px!important' not in s:
              s=s.replace('</style>',extra+'</style>',1)
          p.write_text(s,encoding='utf-8')
      - name: Validar antes de publicar
        shell: python
        run: |
          from pathlib import Path
          import re,subprocess,sys
          s=Path('agendar4.html').read_text(encoding='utf-8')
          for x in ['seven-logo.png?v=3','Higienização profissional de estofados',"$('sofa').onchange=","$('col').onchange=",'R$ 149,00','R$ 209,00']:
              if x not in s: raise SystemExit('Elemento ausente: '+x)
          if '<strong>Seven Limpeza</strong>' in s: raise SystemExit('Texto Seven Limpeza duplicado ainda presente')
          m=re.search(r'<script type="module">(.*?)</script>',s,flags=re.S)
          if not m: raise SystemExit('Script principal não encontrado')
          Path('/tmp/check.mjs').write_text(m.group(1),encoding='utf-8')
          r=subprocess.run(['node','--check','/tmp/check.mjs'],capture_output=True,text=True)
          print(r.stderr)
          if r.returncode: sys.exit(r.returncode)
      - name: Publicar
        run: |
          git config user.name "Seven Agenda Bot"
          git config user.email "actions@users.noreply.github.com"
          git add agendar4.html
          if git diff --cached --quiet; then
            echo "Página já está usando a logo correta."
          else
            git commit -m "Usa logo PNG oficial da Seven no agendamento"
            git push
          fi
