name: Corrigir controles da agenda Seven
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir JavaScript da agenda
        shell: python
        run: |
          from pathlib import Path
          p=Path('agendamento2.html')
          s=p.read_text(encoding='utf-8')

          # Corrige o erro de sintaxe que interrompia TODO o script da agenda.
          # O onclick do botão "Reabrir" estava quebrando a string JavaScript.
          s=s.replace("onclick=\"removerDiaFechado(''+d+'')\"", "onclick=\"removerDiaFechado(\\''+d+'\\')\"")

          # Remove chamada antiga/prematura do Auth, caso ainda exista.
          s=s.replace("window.sevenAuthState(window.sevenAuth,user=>{const b=document.getElementById('btnFecharAgenda');if(b)b.title=user?'Administrador conectado':'Login necessário para alterar a agenda'});\n", "")

          p.write_text(s,encoding='utf-8')

      - name: Validar estrutura
        shell: python
        run: |
          from pathlib import Path
          s=Path('agendamento2.html').read_text(encoding='utf-8')
          if "onclick=\"removerDiaFechado(''+d+'')\"" in s:
              raise SystemExit('Erro de aspas ainda presente')
          for x in [
            'window.alternarAgenda=async function',
            'window.adicionarDiaFechado=async function',
            'window.renderDiasFechados=function',
            'id="btnFecharAgenda"',
            'id="dataFecharAgenda"',
            'firebase-auth.js'
          ]:
              if x not in s:
                  raise SystemExit('Elemento ausente: '+x)
          print('Estrutura da agenda validada.')

      - name: Validar sintaxe do script principal
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess, sys
          html=Path('agendamento2.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?![^>]*type="module")[^>]*>(.*?)</script>', html, flags=re.S)
          # O maior script clássico contém calendário, clientes e controles.
          js=max(scripts,key=len)
          Path('/tmp/agenda-check.js').write_text(js,encoding='utf-8')
          r=subprocess.run(['node','--check','/tmp/agenda-check.js'],capture_output=True,text=True)
          print(r.stdout)
          print(r.stderr)
          if r.returncode!=0:
              sys.exit(r.returncode)

      - name: Publicar
        run: |
          git config user.name "Seven Agenda Bot"
          git config user.email "actions@users.noreply.github.com"
          git add agendamento2.html
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária."
          else
            git commit -m "Corrige JavaScript da agenda e restaura clientes e controles"
            git push
          fi
