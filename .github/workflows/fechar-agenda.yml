name: Aplicar controle de agenda Seven
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar controle por dias
        shell: python
        run: |
          from pathlib import Path

          # ==================== AGENDA ADMINISTRATIVA ====================
          p=Path('agendamento2.html')
          s=p.read_text(encoding='utf-8')

          # Painel visual para escolher dias fechados
          if 'id="diasFechadosPainel"' not in s:
              alvo='<div class="cal-nav"><button onclick="mudarMes(-1)">‹</button>'
              painel='<div id="diasFechadosPainel" class="card" style="margin:14px 0"><div style="font-weight:900;color:var(--azul);margin-bottom:8px">📅 Fechar dias específicos</div><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:end"><div style="flex:1;min-width:180px"><label>Data que não aceitará novos agendamentos</label><input id="dataFecharAgenda" type="date"></div><button class="btn orange" onclick="adicionarDiaFechado()">➕ Fechar este dia</button></div><div id="listaDiasFechados" style="margin-top:12px"></div></div>'
              if alvo not in s: raise SystemExit('Não encontrei o calendário de agendamento2.html')
              s=s.replace(alvo,painel+alvo,1)

          # Funções Firebase para configuração
          old="window.salvarConfigAgenda=async aberta=>{await setDoc(doc(db,'config','agenda'),{aberta,updated_at:Date.now()})};window.carregarConfigAgenda=async()=>{try{const x=await getDoc(doc(db,'config','agenda'));return x.exists()?x.data().aberta!==false:true}catch(e){console.error(e);return true}};"
          new="window.salvarConfigAgenda=async(aberta,dias)=>{const ref=doc(db,'config','agenda');const x=await getDoc(ref);const base=x.exists()?x.data():{};await setDoc(ref,{...base,aberta,diasFechados:Array.isArray(dias)?dias:(base.diasFechados||[]),updated_at:Date.now()})};window.carregarConfigAgenda=async()=>{try{const x=await getDoc(doc(db,'config','agenda'));if(!x.exists())return{aberta:true,diasFechados:[]};const d=x.data();return{aberta:d.aberta!==false,diasFechados:Array.isArray(d.diasFechados)?d.diasFechados:[]}}catch(e){console.error(e);return{aberta:true,diasFechados:[]}}};"
          if old in s: s=s.replace(old,new,1)

          # Variáveis e funções dos dias fechados
          if 'window.diasFechados=[];' not in s:
              alvo='var agendamentos=[];'
              js="""var agendamentos=[];window.diasFechados=[];window.configAgenda={aberta:true,diasFechados:[]};
window.renderDiasFechados=function(){const box=document.getElementById('listaDiasFechados');if(!box)return;const lista=[...window.diasFechados].sort();box.innerHTML=lista.length?lista.map(d=>'<div style="display:flex;justify-content:space-between;align-items:center;background:var(--claro);padding:8px 10px;border-radius:7px;margin:5px 0"><b>🔒 '+d.split('-').reverse().join('/')+'</b><button class="btn red" style="padding:5px 9px;font-size:11px" onclick="removerDiaFechado(\''+d+'\')">✕ Reabrir</button></div>').join(''):'<span style="color:#888;font-size:12px">Nenhum dia fechado.</span>'};
window.adicionarDiaFechado=async function(){const d=document.getElementById('dataFecharAgenda')?.value;if(!d)return alert('Escolha uma data.');if(window.diasFechados.includes(d))return alert('Esse dia já está fechado.');window.diasFechados.push(d);window.diasFechados=[...new Set(window.diasFechados)].sort();await window.salvarConfigAgenda(window.agendaAberta,window.diasFechados);window.renderDiasFechados();alert('Dia '+d.split('-').reverse().join('/')+' fechado para novos agendamentos.');};
window.removerDiaFechado=async function(d){window.diasFechados=window.diasFechados.filter(x=>x!==d);await window.salvarConfigAgenda(window.agendaAberta,window.diasFechados);window.renderDiasFechados();};
"""
              if alvo not in s: raise SystemExit('Não encontrei var agendamentos em agendamento2.html')
              s=s.replace(alvo,js,1)

          # Carregar configuração incluindo dias fechados
          oldready="window.addEventListener('DOMContentLoaded',async()=>{window.aplicarStatusAgenda(await window.carregarConfigAgenda());const q=query(collection(db,'agendamentos'),orderBy('service_date'));"
          newready="window.addEventListener('DOMContentLoaded',async()=>{window.configAgenda=await window.carregarConfigAgenda();window.diasFechados=window.configAgenda.diasFechados||[];window.aplicarStatusAgenda(window.configAgenda.aberta);window.renderDiasFechados();const q=query(collection(db,'agendamentos'),orderBy('service_date'));"
          if oldready in s: s=s.replace(oldready,newready,1)

          # ==================== FORMULÁRIO DO CLIENTE ====================
          p.write_text(s,encoding='utf-8')
          p=Path('agendar4.html')
          s=p.read_text(encoding='utf-8')

          # Substitui a verificação antiga por uma que também lê diasFechados
          oldcheck="async function verificarAgendaAberta(){try{const x=await getDoc(doc(db,'config','agenda'));const aberta=!x.exists()||x.data().aberta!==false;if(!aberta){document.getElementById('agendaClosedOverlay').classList.add('active');document.querySelectorAll('button').forEach(b=>{if(b.id!=='new')b.disabled=true});}return aberta}catch(e){console.error(e);return true}}\nverificarAgendaAberta();"
          newcheck="""window.diasFechados=[];window.agendaAberta=true;async function verificarAgendaAberta(){try{const x=await getDoc(doc(db,'config','agenda'));const d=x.exists()?x.data():{};window.diasFechados=Array.isArray(d.diasFechados)?d.diasFechados:[];window.agendaAberta=d.aberta!==false;if(!window.agendaAberta){document.getElementById('agendaClosedOverlay').classList.add('active');document.querySelectorAll('button').forEach(b=>{if(b.id!=='new')b.disabled=true});}return window.agendaAberta}catch(e){console.error(e);return true}}
verificarAgendaAberta();
function dataSelecionada(){if(chosen&&chosen.date)return chosen.date;const el=document.querySelector('#days .day.selected');return el?.dataset?.date||''}
function diaEstaFechado(d){return !!d&&window.diasFechados.includes(d)}
"""
          if oldcheck not in s: raise SystemExit('Não encontrei verificarAgendaAberta em agendar4.html')
          s=s.replace(oldcheck,newcheck,1)

          # Intercepta o botão Continuar da etapa de horário. Assim o cliente não consegue avançar em dia fechado.
          if 'diaEstaFechado(dataSelecionada())' not in s:
              alvo="$('cont').onclick=()=>{"
              if alvo not in s:
                  raise SystemExit('Não encontrei o botão cont em agendar4.html')
              s=s.replace(alvo,"$('cont').onclick=()=>{if(diaEstaFechado(dataSelecionada())){error('A Seven não está aceitando novos agendamentos nesta data. Escolha outro dia.');return;}",1)

          p.write_text(s,encoding='utf-8')

      - name: Validar arquivos
        shell: python
        run: |
          from pathlib import Path
          a=Path('agendamento2.html').read_text(encoding='utf-8')
          b=Path('agendar4.html').read_text(encoding='utf-8')
          checks=[
            ('agendamento2.html','diasFechadosPainel' in a),
            ('agendamento2.html','adicionarDiaFechado' in a),
            ('agendar4.html','diasFechados' in b),
            ('agendar4.html','diaEstaFechado(dataSelecionada())' in b),
          ]
          for nome,ok in checks:
            if not ok: raise SystemExit('Falha na validação: '+nome)
          print('Controle por dias específicos instalado com sucesso.')

      - name: Publicar
        run: |
          git config user.name "Seven Agenda Bot"
          git config user.email "actions@users.noreply.github.com"
          git add agendamento2.html agendar4.html
          if git diff --cached --quiet; then echo "Nenhuma alteração necessária."; else git commit -m "Ativa fechamento de dias específicos"; git push; fi
