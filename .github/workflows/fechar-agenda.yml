name: Atualizar pagina de agendamento Seven

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Atualizar agendar4
        run: python .github/scripts/update_agendar4.py

      - name: Deixar card Carpete horizontal
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('agendar4.html')
          s=p.read_text(encoding='utf-8')
          css='''
/* ===== Carpete horizontal largura dupla ===== */
.service-mobile-grid .service-card:has(#carpete){grid-column:span 2!important}
.service-mobile-grid .service-card:has(#carpete)>label{min-height:78px!important;display:grid!important;grid-template-columns:42px 1fr!important;grid-template-rows:auto auto!important;column-gap:10px!important;align-items:center!important;padding:10px 12px!important}
.service-mobile-grid .service-card:has(#carpete) .service-icon{grid-row:1/3!important;margin:0!important;width:36px!important;height:36px!important;font-size:20px!important}
.service-mobile-grid .service-card:has(#carpete) .service-name{font-size:15px!important;align-self:end!important}
.service-mobile-grid .service-card:has(#carpete) .service-count{font-size:11px!important;padding:2px 0 0!important;margin:0!important;align-self:start!important}
@media(max-width:700px){.service-mobile-grid .service-card:has(#carpete){grid-column:1/-1!important}.service-mobile-grid .service-card:has(#carpete)>label{min-height:72px!important;grid-template-columns:38px 1fr!important;padding:9px 10px!important}.service-mobile-grid .service-card:has(#carpete) .service-icon{width:32px!important;height:32px!important;font-size:18px!important}.service-mobile-grid .service-card:has(#carpete) .service-name{font-size:14px!important}.service-mobile-grid .service-card:has(#carpete) .service-count{font-size:10px!important}}
'''
          marker='/* ===== Carpete horizontal largura dupla ===== */'
          if marker not in s:
              s=s.replace('</style>',css+'</style>',1)
          else:
              s=re.sub(r'/\* ===== Carpete horizontal largura dupla ===== \*/.*?(?=</style>)',css.strip()+'\n',s,flags=re.S)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Validar JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, sys
          s = Path('agendar4.html').read_text(encoding='utf-8')
          required = [
              'id="sofa"','id="col"','id="pol"','id="cad"','id="carro"','id="carpete"','id="cab"',
              'Escolha o item abaixo, veja o preço e agende em 2 minutos.',
              'Pague só no dia','Seguro para pets e crianças','Cards compactos Seven',
              'Carpete horizontal largura dupla'
          ]
          for item in required:
              if item not in s:
                  raise SystemExit('Faltando: ' + item)
          m = re.search(r'<script type="module">(.*?)</script>', s, re.S)
          if not m:
              raise SystemExit('Script principal nao encontrado')
          Path('/tmp/check.mjs').write_text(m.group(1), encoding='utf-8')
          r = subprocess.run(['node','--check','/tmp/check.mjs'], capture_output=True, text=True)
          print(r.stderr)
          sys.exit(r.returncode)
          PY

      - name: Publicar alteracao
        run: |
          git config user.name "Seven Agenda Bot"
          git config user.email "actions@users.noreply.github.com"
          git add agendar4.html
          if git diff --cached --quiet; then
            echo "Pagina ja esta atualizada."
          else
            git commit -m "Deixa card Carpete horizontal e em largura dupla"
            git push
          fi
