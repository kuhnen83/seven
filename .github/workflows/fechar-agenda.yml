name: Atualizar fechamento da agenda
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Atualizar os dois HTMLs
        shell: python
        run: |
          from pathlib import Path

          # ---------- agendamento2.html ----------
          p = Path('agendamento2.html')
          s = p.read_text(encoding='utf-8')

          if 'id="agendaStatusBadge"' not in s:
              old = '<div class="agenda-container" id="telaAgenda"><h2 class="agenda-title">🗓️ Agenda de Clientes - Seven</h2>'
              new = '<div class="agenda-container" id="telaAgenda"><div class="agenda-head"><h2 class="agenda-title">🗓️ Agenda de Clientes - Seven</h2><div class="agenda-control"><span id="agendaStatusBadge" class="agenda-open">🟢 AGENDA ABERTA</span><button id="btnFecharAgenda" class="btn red" onclick="alternarAgenda()">🔒 Fechar agenda</button></div></div>'
              if old not in s:
                  raise SystemExit('Não encontrei o cabeçalho da agenda em agendamento2.html')
              s = s.replace(old, new, 1)

          if '.agenda-head{' not in s:
              s = s.replace('.agenda-container{padding:20px}', '.agenda-container{padding:20px}.agenda-head{display:flex;align-items:center;justify-content:space-between;gap:15px;border-bottom:2px solid var(--claro);padding-bottom:10px}.agenda-head .agenda-title{border:0;padding:0;margin:0}.agenda-control{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.agenda-control .btn{padding:9px 12px;font-size:12px}.agenda-open,.agenda-closed{font-size:11px;font-weight:900;padding:8px 10px;border-radius:18px}.agenda-open{background:#e8f7ee;color:#168b57}.agenda-closed{background:#fde8eb;color:#b42332}', 1)

          imp_old = "import{getFirestore,collection,addDoc,updateDoc,deleteDoc,doc,query,orderBy,onSnapshot}from"
          imp_new = "import{getFirestore,collection,addDoc,updateDoc,deleteDoc,doc,query,orderBy,onSnapshot,setDoc,getDoc}from"
          if imp_old in s:
              s = s.replace(imp_old, imp_new, 1)

          cloud_old = "window.excluirAgendamentoCloud=async id=>{try{await deleteDoc(doc(db,'agendamentos',id));return true}catch(e){console.error(e);return false}};"
          cloud_new = cloud_old + "window.salvarConfigAgenda=async aberta=>{await setDoc(doc(db,'config','agenda'),{aberta,updated_at:Date.now()})};window.carregarConfigAgenda=async()=>{try{const x=await getDoc(doc(db,'config','agenda'));return x.exists()?x.data().aberta!==false:true}catch(e){console.error(e);return true}};"
          if 'window.salvarConfigAgenda=' not in s:
              if cloud_old not in s:
                  raise SystemExit('Não encontrei as funções Firestore em agendamento2.html')
              s = s.replace(cloud_old, cloud_new, 1)

          # Corrige também o problema anterior que fazia os agendamentos desaparecerem do calendário.
          s = s.replace('window.agendamentos=s.docs.map(x=>({id:x.id,...x.data()}));', 'agendamentos=s.docs.map(x=>({id:x.id,...x.data()}));', 1)

          if 'window.agendaAberta=true;' not in s:
              s = s.replace('var agendamentos=[];', "var agendamentos=[];window.agendaAberta=true;window.alternarAgenda=async function(){const novo=!window.agendaAberta;if(!novo&&!confirm('Fechar a agenda? Novos clientes não poderão realizar agendamentos pelo site até você abrir novamente.'))return;try{await window.salvarConfigAgenda(novo);window.aplicarStatusAgenda(novo)}catch(e){console.error(e);alert('Não foi possível alterar o status da agenda.')}};window.aplicarStatusAgenda=function(aberta){window.agendaAberta=aberta;const b=document.getElementById('agendaStatusBadge'),btn=document.getElementById('btnFecharAgenda');if(!b||!btn)return;b.className=aberta?'agenda-open':'agenda-closed';b.textContent=aberta?'🟢 AGENDA ABERTA':'🔴 AGENDA FECHADA';btn.textContent=aberta?'🔒 Fechar agenda':'🔓 Abrir agenda';btn.className='btn '+(aberta?'red':'green')};", 1)

          ready_old = "window.addEventListener('DOMContentLoaded',()=>{const q=query(collection(db,'agendamentos'),orderBy('service_date'));"
          ready_new = "window.addEventListener('DOMContentLoaded',async()=>{window.aplicarStatusAgenda(await window.carregarConfigAgenda());const q=query(collection(db,'agendamentos'),orderBy('service_date'));"
          if ready_old in s:
              s = s.replace(ready_old, ready_new, 1)

          p.write_text(s, encoding='utf-8')

          # ---------- agendar4.html ----------
          p = Path('agendar4.html')
          s = p.read_text(encoding='utf-8')

          if 'id="agendaClosedOverlay"' not in s:
              css_old = '@media(max-width:600px)'
              css_new = '.agenda-closed-overlay{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:18px;z-index:9999}.agenda-closed-overlay.active{display:flex}.agenda-closed-card{max-width:430px;width:100%;background:#fff;border-radius:18px;padding:28px;text-align:center;box-shadow:0 15px 50px #0005}.agenda-closed-icon{font-size:48px}.agenda-closed-card h2{color:#0f4c81;margin:10px 0}.agenda-closed-card p{color:#68707a;line-height:1.5}.agenda-closed-card a{display:block;background:#20a45a;color:#fff;text-decoration:none;border-radius:9px;padding:14px;font-weight:800;margin-top:18px}' + css_old
              if css_old not in s:
                  raise SystemExit('Não encontrei o CSS responsivo em agendar4.html')
              s = s.replace(css_old, css_new, 1)

              body_old = '<body>\n<div class="wrap">'
              body_new = '<body>\n<div id="agendaClosedOverlay" class="agenda-closed-overlay"><div class="agenda-closed-card"><div class="agenda-closed-icon">🔒</div><h2>Agenda temporariamente fechada</h2><p>No momento, a Seven está com a agenda fechada para novos agendamentos.</p><p>Entre em contato pelo WhatsApp para consultar disponibilidade.</p><a href="https://wa.me/5548996782471" target="_blank" rel="noopener">💬 Falar com a Seven pelo WhatsApp</a></div></div>\n<div class="wrap">'
              if body_old not in s:
                  raise SystemExit('Não encontrei o body de agendar4.html')
              s = s.replace(body_old, body_new, 1)

              imp_old = "import{getFirestore,collection,query,where,getDocs,addDoc}from"
              imp_new = "import{getFirestore,collection,query,where,getDocs,addDoc,doc,getDoc}from"
              if imp_old not in s:
                  raise SystemExit('Não encontrei o import do Firestore em agendar4.html')
              s = s.replace(imp_old, imp_new, 1)

              needle = "const db=getFirestore(initializeApp(firebaseConfig));const $=id=>document.getElementById(id);let chosen=null;"
              replacement = needle + "\nasync function verificarAgendaAberta(){try{const x=await getDoc(doc(db,'config','agenda'));const aberta=!x.exists()||x.data().aberta!==false;if(!aberta){document.getElementById('agendaClosedOverlay').classList.add('active');document.querySelectorAll('button').forEach(b=>{if(b.id!=='new')b.disabled=true});}return aberta}catch(e){console.error(e);return true}}\nverificarAgendaAberta();"
              if needle not in s:
                  raise SystemExit('Não encontrei a inicialização do Firestore em agendar4.html')
              s = s.replace(needle, replacement, 1)

          p.write_text(s, encoding='utf-8')

      - name: Verificar alterações
        run: |
          grep -q 'agendaStatusBadge' agendamento2.html
          grep -q 'agendaClosedOverlay' agendar4.html
          grep -q 'salvarConfigAgenda' agendamento2.html
          grep -q 'verificarAgendaAberta' agendar4.html

      - name: Commit e publicação
        run: |
          git config user.name "Seven Agenda Bot"
          git config user.email "actions@users.noreply.github.com"
          git add agendamento2.html agendar4.html
          if git diff --cached --quiet; then
            echo "Os dois HTMLs já estão atualizados."
          else
            git commit -m "Implementa controle manual de abertura e fechamento da agenda"
            git push
          fi
